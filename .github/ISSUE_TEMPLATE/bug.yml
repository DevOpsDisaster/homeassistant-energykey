name: Bug report
description: Report a reproducible problem without sharing private portal data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve EnergyKey. Treat the EnergyKey Cookie header as a password.
        Do not attach cookies, raw portal responses, addresses, customer IDs, meter IDs, or unredacted screenshots and logs.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.7.0
    validations:
      required: true
  - type: input
    id: hacs_version
    attributes:
      label: HACS version
      description: Enter "manual" when HACS was not used.
    validations:
      required: true
  - type: dropdown
    id: meter_kind
    attributes:
      label: Affected meter type
      options:
        - Water
        - District heating
        - Both
        - Session or setup only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result, actual result, and reproducible steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or logs
      description: Download diagnostics from Home Assistant and inspect them before attaching. Debug logs must be manually reviewed and redacted.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included cookies, tokens, raw portal payloads, addresses, customer identifiers, or meter identifiers.
          required: true
        - label: I have reviewed every attached log, diagnostic file, and screenshot for private information.
          required: true
        - label: I understand that public issues are not an appropriate place for security vulnerabilities.
          required: true
