name: Feature request
description: Suggest a read-only EnergyKey capability or usability improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Do not include cookies, real meter identifiers, addresses, or raw portal responses.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain the user problem rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Scope confirmation
      options:
        - label: The request does not require write operations against EnergyKey or browser/MitID automation.
          required: true
        - label: I have not included private portal data.
          required: true
