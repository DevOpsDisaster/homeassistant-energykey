name: Create GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Verify manifest version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if re.fullmatch(
              r"\d+\.\d+\.\d+(?:-(?:beta|rc)\.\d+)?", tag_version
          ) is None:
              raise SystemExit(f"Unsupported release tag: {tag_version}")
          manifest = json.loads(
              Path("custom_components/energykey/manifest.json").read_text()
          )
          if manifest["version"] != tag_version:
              raise SystemExit(
                  f"Manifest version {manifest['version']} does not match {tag_version}"
              )
          PY
      - name: Require stable tags to point to main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-beta.*|*-rc.*) exit 0 ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run source checks
        run: |
          ruff check .
          ruff format --check .
          pytest --cov=custom_components.energykey --cov-report=term --cov-fail-under=90
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
      # Validation is read-only and does not submit anything to HACS.
      - name: Run HACS validation (no publishing)
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
      - name: Scan tagged history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compatibility:
    name: Import on Home Assistant ${{ matrix.home_assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home_assistant:
          - "2026.7.0"
          - stable
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Import all integration modules
        env:
          HOME_ASSISTANT_TAG: ${{ matrix.home_assistant }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "ghcr.io/home-assistant/home-assistant:$HOME_ASSISTANT_TAG" \
            python -c "from custom_components.energykey import api, config_flow, coordinator, diagnostics, sensor, statistics, storage"

  github-release:
    name: Publish GitHub release only
    needs:
      - validate-release
      - compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          prerelease=""
          case "$RELEASE_TAG" in
            *-beta.*|*-rc.*) prerelease="--prerelease" ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --generate-notes \
            $prerelease
