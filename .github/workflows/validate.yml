name: Validate

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest --cov=custom_components.energykey --cov-report=term --cov-fail-under=90

  compatibility:
    name: Integration smoke test on Home Assistant ${{ matrix.home_assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home_assistant:
          - "2026.7.0"
          - stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install matching Home Assistant test harness
        env:
          HOME_ASSISTANT_VERSION: ${{ matrix.home_assistant }}
        run: |
          if [ "$HOME_ASSISTANT_VERSION" = stable ]; then
            HOME_ASSISTANT_VERSION=$(python - <<'PY'
          import json
          import re
          from urllib.request import urlopen

          with urlopen(
              "https://pypi.org/pypi/homeassistant/json", timeout=30
          ) as response:
              releases = json.load(response)["releases"]
          stable = [
              (tuple(map(int, raw.split("."))), raw)
              for raw in releases
              if re.fullmatch(r"\d+\.\d+\.\d+", raw)
          ]
          print(max(stable)[1])
          PY
            )
          fi
          python -m pip install -r requirements-dev.txt \
            "homeassistant==$HOME_ASSISTANT_VERSION"
      - name: Exercise config entry lifecycle
        run: pytest -q tests/test_integration.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This action only validates the repository. It cannot add the integration
      # to HACS. Default-store inclusion requires a separate manual hacs/default PR.
      - name: Run HACS validation (no publishing)
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
          # These repository-metadata checks are required for HACS default-store
          # submission, which is intentionally deferred. Remove both ignores
          # before opening a future PR against hacs/default.
          ignore: topics description

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
