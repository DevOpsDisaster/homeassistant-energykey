name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest --cov=custom_components.energykey --cov-report=term --cov-fail-under=90

  compatibility:
    name: Import on Home Assistant ${{ matrix.home_assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home_assistant:
          - "2026.7.0"
          - stable
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Import all integration modules
        env:
          HOME_ASSISTANT_TAG: ${{ matrix.home_assistant }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "ghcr.io/home-assistant/home-assistant:$HOME_ASSISTANT_TAG" \
            python -c "from custom_components.energykey import api, config_flow, coordinator, diagnostics, sensor, statistics, storage"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # This action only validates the repository. It cannot add the integration
      # to HACS. Default-store inclusion requires a separate manual hacs/default PR.
      - name: Run HACS validation (no publishing)
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
          # These repository-metadata checks are required for HACS default-store
          # submission, which is intentionally deferred. Remove both ignores
          # before opening a future PR against hacs/default.
          ignore: topics description

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
