version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      development-dependencies:
        patterns:
          - "*"
  - package-ecosystem: devcontainers
    directory: "/.devcontainer"
    schedule:
      interval: monthly
    groups:
      devcontainer-features:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: monthly
    groups:
      devcontainer-images:
        patterns:
          - "*"
